# Harness project state file — copy to docs/.harness-state.yaml to use
# Rules (HARNESS-PROCESS-STANDARD v1.2 / specs/2026-06-12-harness-assistant-design.md §3):
#   1. Gate approved + approver must be recorded by a human (no arbitrary AI approval — §4.8 CQ3)
#   2. Files are the source of truth, state is a hint — /08-harness cross-checks against actual deliverables and proposes corrections
#   3. Tracked in git (team sharing / history)

harness_version: "1.5"          # Standard version in effect (an audit is recommended if it differs from the package version)
project: "{project name}"
current_step: "00"              # "00"=before Setup (pre-skill preparation) is complete, then "01"~"06"

steps:
  "01": { status: not_started }   # status: not_started | in_progress | done
  "02": { status: not_started }   # when done, add outputs_verified: true, at: YYYY-MM-DD
  "03": { status: not_started }
  "04": { status: not_started }   # Runs repeatedly per sprint (each sprint is tracked via docs/sprints/ logs)
  "05": { status: not_started }
  "06": { status: not_started }

gates:
  G1: { status: not_reached }     # status: not_reached | pending | approved
  G2: { status: not_reached }     # when approved: approver: "name", at: YYYY-MM-DD (recorded by a human)
  G3: { status: not_reached }

last_audit:                       # Updated by /08-harness audit mode
  date: null
  score: null
  verdict: null                   # PASS | WARN | FAIL
  report: null                    # reviews/standard-validation-{YYYYMMDD}.md
